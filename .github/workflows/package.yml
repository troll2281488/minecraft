name: Package browser game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          find src tests -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file" || exit 1
          done
      - name: Run focused gameplay regression tests
        run: node tests/run-node.mjs
      - name: Create ZIP
        run: |
          zip -qr minecraft-1.12.2-prototype.zip . \
            -x '.git/*' 'saves/*' 'node_modules/*'
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.12.2-prototype
          path: minecraft-1.12.2-prototype.zip
          retention-days: 30
