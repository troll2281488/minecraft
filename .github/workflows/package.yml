name: Package browser game
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download authorized Minecraft entity models and animations
        run: bash scripts/fetch-vanilla-entity-models.sh
      - name: Download authorized mob textures
        run: bash scripts/fetch-mob-textures.sh
      - name: Generate the project's own sound library
        run: python3 scripts/render_sound_library.py
      - name: Download bundled CC0 sound effects
        run: bash scripts/fetch-bundled-sounds.sh
      - name: Build standalone textures and models library
        run: bash scripts/package-assets-library.sh
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-assets-library
          path: minecraft-assets-library.zip
          retention-days: 90
      - name: Check JavaScript syntax
        run: |
          find src tests -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file" || exit 1
          done
      - name: Run focused gameplay regression tests
        run: node tests/run-node.mjs
      - name: Create ZIP
        run: |
          zip -qr minecraft-java-1.19-prototype.zip . \
            -x '.git/*' 'saves/*' 'node_modules/*'
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-java-1.19-prototype
          path: minecraft-java-1.19-prototype.zip
          retention-days: 30
