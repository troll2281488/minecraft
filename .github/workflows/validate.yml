name: Validate Minecraft feature branch

on:
  push:
    branches: [feature/minecraft-1.11-exploration-update]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:features
      - run: npm run check:types
      - run: npm run build
