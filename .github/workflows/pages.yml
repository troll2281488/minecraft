name: Deploy Minecraft to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download authorized Minecraft entity models and animations
        run: bash scripts/fetch-vanilla-entity-models.sh
      - name: Download authorized mob textures
        run: bash scripts/fetch-mob-textures.sh
      - name: Generate the project's own sound library
        run: python3 scripts/render_sound_library.py
      - name: Download bundled CC0 sound effects
        run: bash scripts/fetch-bundled-sounds.sh
      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file" || exit 1
          done
      - name: Download bundled CC0 background music
        run: bash scripts/fetch-bundled-music.sh
      - name: Verify audio assets before publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          wavs = list(Path('assets/sound_library').glob('*.wav'))
          if len(wavs) != 49:
              raise SystemExit(f'Expected 49 generated WAV effects, found {len(wavs)}')
          if not Path('assets/sound_library.zip').is_file():
              raise SystemExit('Generated sound archive is missing')

          effects = json.loads(Path('assets/audio/manifest.json').read_text())
          if len(effects.get('files', [])) < 7:
              raise SystemExit('Bundled CC0 effects manifest is incomplete')

          music = json.loads(Path('assets/audio/music/manifest.json').read_text())
          tracks = music.get('tracks', [])
          if len(tracks) != 5:
              raise SystemExit(f'Expected 5 background tracks, found {len(tracks)}')
          for track in tracks:
              path = Path('assets/audio/music') / track['file']
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty music track: {path}')

          print(f'Audio check passed: {len(wavs)} generated WAV effects, '
                f'{len(effects["files"])} bundled CC0 effects, {len(tracks)} music tracks.')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
