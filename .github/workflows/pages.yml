name: Deploy Minecraft to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download authorized Minecraft entity models and animations
        run: bash scripts/fetch-vanilla-entity-models.sh
      - name: Download authorized mob textures
        run: bash scripts/fetch-mob-textures.sh
      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file" || exit 1
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
